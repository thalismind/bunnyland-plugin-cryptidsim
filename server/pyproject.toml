[project]
name = "bunnyland-cryptidsim"
version = "0.2.0"
description = "Out-of-tree Bunnyland plugin: a cryptozoology expansion pack — rare, elusive mystery creatures, uncertain sightings, and a confirm-over-time case-file loop."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Thalis Mind" },
]
keywords = [
    "bunnyland",
    "cryptid",
    "ecs",
    "plugin",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bunnyland>=1.0.0,<2",
    "pydantic>=2.0",
    "relics-ecs>=0.1.1,<0.2",
]

[project.urls]
Documentation = "https://github.com/thalismind/bunnyland-plugin-cryptidsim#readme"
Issues = "https://github.com/thalismind/bunnyland-plugin-cryptidsim/issues"
Repository = "https://github.com/thalismind/bunnyland-plugin-cryptidsim"

[project.entry-points."bunnyland.plugins"]
"bunnyland.cryptidsim" = "bunnyland_cryptidsim.plugin:bunnyland_plugins"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunnyland_cryptidsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
